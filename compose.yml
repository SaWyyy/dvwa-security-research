services:
  dvwa:
    build: .              
    container_name: dvwa
    restart: always
    ports:
      - "80:80"
    environment:
      - DB_SERVER=db
      - DB_DATABASE=dvwa
      - DB_USER=dvwa
      - DB_PASSWORD=password
      - DEFAULT_SECURITY_LEVEL=low
    depends_on:
      - db

  db:
    image: mariadb:10
    container_name: dvwa-db
    restart: always
    environment:
      - MYSQL_DATABASE=dvwa
      - MYSQL_USER=dvwa
      - MYSQL_PASSWORD=password
      - MYSQL_ROOT_PASSWORD=password
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: