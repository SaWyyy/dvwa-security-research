name: DevSecOps Research Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  security-analysis:
    name: Run Security Tools - ${{ matrix.level }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        level: [low, medium, high, impossible]    

    steps:
      # 1. Pobranie kodu
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Przygotowanie katalogu na raporty
      - name: Prepare Report Directory
        run: |
          mkdir -p reports
          chmod 777 reports
          chmod 777 .

      # ----------------------------------------------------------------
      # KROK A: Secret Scanning (Gitleaks)
      # ----------------------------------------------------------------
      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        with:
          config-path: .gitleaks.toml
        
      # ----------------------------------------------------------------
      # KROK B: IaC Scanning (Checkov)
      # ----------------------------------------------------------------
      - name: IaC Scanning (Checkov)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: dockerfile,secrets
          output_format: json 
          output_file_path: reports/checkov_report.json
        continue-on-error: true

      # ----------------------------------------------------------------
      # KROK C: SCA - Software Composition Analysis (Trivy)
      # ----------------------------------------------------------------
      - name: SCA Scanning (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs' # Skanujemy system plików
          format: 'json'
          output: 'reports/trivy_report.json'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      # ----------------------------------------------------------------
      # KROK D: SAST - Static Application Security Testing (Semgrep)
      # ----------------------------------------------------------------
      - name: SAST Scanning (Semgrep)
        run: |
          mkdir -p reports
          # Instalacja i uruchomienie Semgrep w trybie CLI (JSON output)
          python3 -m pip install semgrep
          semgrep scan --config=p/php --json --output=reports/semgrep_report.json .
        continue-on-error: true

      # ----------------------------------------------------------------
      # KROK E: Uruchomienie aplikacji do testów dynamicznych
      # ----------------------------------------------------------------
      - name: Start DVWA Environment
        run: docker compose up -d --build

      - name: Initialize DVWA Database (Python)
        run: |
          pip install requests
          
          cat <<EOF > setup_db.py
          import requests
          import re
          import sys
          import time

          url = "http://localhost:80/setup.php"
          login_url = "http://localhost:80/login.php"
          
          # 1. Czekamy na Apache (port 80)
          print("--- 1. Czekam na serwer WWW (Apache)... ---")
          server_up = False
          for i in range(60):
              try:
                  requests.get(login_url, timeout=2)
                  server_up = True
                  print(f"Apache odpowiedzial po {i} sekundach.")
                  break
              except:
                  time.sleep(1)

          if not server_up:
              print("FATAL: Apache nie wstal.")
              sys.exit(1)

          session = requests.Session()
          
          # 2. Pętla próbująca zainicjować bazę (Retry na błędy MySQL)
          print("--- 2. Proba inicjalizacji bazy danych... ---")
          max_retries = 30 # 30 prób x 2 sekundy = 60 sekund czekania na bazę
          
          for attempt in range(max_retries):
              try:
                  # A. Pobieramy token CSRF (za każdym razem nowy)
                  r = session.get(url)
                  match = re.search(r"user_token' value='([a-f0-9]+)'", r.text)
                  if not match:
                      print(f"Proba {attempt+1}: Nie widze tokena (moze DB lezy?). Czekam...")
                      time.sleep(2)
                      continue
                  
                  token = match.group(1)

                  # B. Wysyłamy POST setup
                  data = {'create_db': 'Create / Reset Database', 'user_token': token}
                  r_post = session.post(url, data=data, allow_redirects=False)
                  
                  # C. Analiza odpowiedzi
                  response_text = r_post.text
                  
                  # Sprawdzamy sukces
                  if r_post.status_code == 302 or "Location: login.php" in str(r_post.headers):
                      print("SUKCES: Baza utworzona (Redirect).")
                      sys.exit(0)
                  
                  # Sprawdzamy błąd połączenia z bazą
                  if "Connection refused" in response_text or "mysqli_sql_exception" in response_text:
                      print(f"Proba {attempt+1}: Baza danych odrzuca polaczenie (Connection refused). Czekam 2s...")
                      time.sleep(2)
                      continue # Sprobuj jeszcze raz
                  
                  # Inny sukces (czasem DVWA zwraca 200 z komunikatem)
                  if "Database has been created" in response_text:
                      print("SUKCES: Baza utworzona (Komunikat HTML).")
                      sys.exit(0)
                      
                  # Inny błąd
                  print(f"Nieznana odpowiedz (Kod {r_post.status_code}). Ponawiam...")
                  time.sleep(2)

              except Exception as e:
                  print(f"Wyjatek: {e}. Ponawiam...")
                  time.sleep(2)

          print("FATAL: Nie udalo sie utworzyc bazy po wielu probach.")
          sys.exit(1)
          EOF
          
          python3 setup_db.py

      # ----------------------------------------------------------------
      # KROK F: Przekazanie poziomu do pliku (dla Dockera)
      # ----------------------------------------------------------------
      - name: Create Config File for ZAP Hook
        run: echo "${{ matrix.level }}" > security_level.txt

      # ----------------------------------------------------------------
      # KROK G: DAST - Dynamic Application Security Testing (OWASP ZAP)
      # ----------------------------------------------------------------
      - name: DAST Scanning (${{ matrix.level }})
        uses: zaproxy/action-full-scan@v0.12.0
        env:
          SECURITY_LEVEL: ${{ matrix.level }} 
        with:
          target: 'http://localhost:80/'
          allow_issue_writing: false
          cmd_options: '--hook zap_hooks.py -d -j'
        continue-on-error: true

      # ----------------------------------------------------------------
      # KROK H: Zmiana nazw i przeniesienie raportów
      # ----------------------------------------------------------------
      - name: Rename and Move ZAP Reports
        run: |
          if [ -f report_html.html ]; then
            mv report_html.html reports/zap_report_${{ matrix.level }}.html
            echo "Raport HTML przeniesiony."
          else
            echo "WARNING: Nie znaleziono report_html.html"
          fi

          if [ -f report_json.json ]; then
            mv report_json.json reports/zap_report_${{ matrix.level }}.json
            echo "Raport JSON przeniesiony."
          else
            echo "WARNING: Nie znaleziono report_json.json"
          fi

      # ----------------------------------------------------------------
      # KROK I: Zbieranie Danych (Artifact Upload)
      # ----------------------------------------------------------------
      - name: Upload Research Data (${{ matrix.level }})
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "security-reports-${{ matrix.level }}"
          path: reports/
          overwrite: true